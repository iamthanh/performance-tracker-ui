<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Training analysis for your fitness-hub data: fitness, fatigue, form, power and health." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Performance Tracker</title>
    <script>
      // Apply a saved light/dark choice before first paint (no flash).
      try {
        var t = localStorage.getItem("pt-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
