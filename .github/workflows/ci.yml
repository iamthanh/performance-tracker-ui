name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Pick the fitness-hub-core branch (same name if it exists, else main)
        id: core
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/iamthanh/performance-tracker-backend.git "$BRANCH" > /dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          repository: iamthanh/performance-tracker-backend
          ref: ${{ steps.core.outputs.ref }}
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core + app
        run: |
          python -m pip install --upgrade pip
          pip install -e './core[garmin]' -e '.[dev]'
      - name: Test
        run: pytest
      - name: CLI smoke test
        env:
          FITNESS_HUB_HOME: ${{ runner.temp }}/fitness-hub-home
        run: |
          fitness-hub --help
          fitness-hub status
          fitness-hub sync
