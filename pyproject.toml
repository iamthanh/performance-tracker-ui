[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "fitness-hub-mcp"
version = "0.1.0"
description = "fitness-hub app: CLI and MCP server that give Claude read access to your local Strava, Garmin and Google Health data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Versioned together with the core library (repo: performance-tracker-backend).
    "fitness-hub-core~=0.1.0",
    # FastMCP API of the 1.x line; 2.x was not reviewed.
    "mcp>=1.30,<2",
]

[project.optional-dependencies]
garmin = ["fitness-hub-core[garmin]~=0.1.0"]
dev = ["pytest>=8"]

[project.scripts]
fitness-hub = "fitness_hub.cli:main"

# This distribution adds modules to the `fitness_hub` package owned by
# fitness-hub-core (no __init__.py here; core's __init__ uses extend_path).
[tool.hatch.build.targets.wheel]
packages = ["src/fitness_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
